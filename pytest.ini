[pytest]
testpaths = tests
markers =
    network: hits live external registries (PubChem / UniChem). Deselected by default;
        run with `pytest -m network`. Never let a network test's failure mode be
        interpreted as a scientific result.
    slow: needs a GPU, the feature store, or minutes of compute. Deselected by default;
        run with `pytest -m slow`. Keeps the default suite hermetic and seconds-long so
        there is no incentive to skip it.
# Default run is hermetic and offline-reproducible.
# This file is the single source of pytest configuration: it takes precedence over
# pyproject.toml's [tool.pytest.ini_options], so that section is deliberately absent there.
addopts = -m "not network and not slow"
