# HPC: the fully specified model. This is the one to report.
#
# Derived from configs/default.yaml. ONLY caps and member counts differ, so the science
# (losses, splits, reward, filters, thresholds) is identical to the default.
#
# THE COST STRUCTURE, because it is not obvious. tnk1/uq/ensemble.py reads
#     if cfg["uq"]["independent_kinome_training"] or shared_ckpt is None:
#         model = kinome_stage(...)        # a FULL kinome training pass
# and train_ensemble is always called with shared_ckpt=None, so the condition is True
# whatever independent_kinome_training says -- the branch that loads a shared trunk is
# dead code (see CHANGES_V3.md). Every member therefore pays a full kinome pass:
#     ens  = uq.n_members                       passes
#     oof  = 5 outer folds x uq.oof_members     passes
#
# uq.oof_members is read as cfg["uq"].get("oof_members", 5) in run_stage4_uq.py but was
# never declared in default.yaml -- a knob that existed only in code. It is declared here.
#
# This node: 1x H100 NVL (94 GB), 128 CPUs, 125 GB RAM, partition LocalQ (NO time limit).
# The graph cache (TNK1_GRAPH_CACHE=420000) covers all 331,620 unique compounds, so only
# the first epoch pays RDKit featurisation and later epochs are GPU-bound.
#
# 1,103,498 rows, 10 ensemble members, 5 oof members -> 10 + 25 = 35 kinome passes.
# LocalQ has no wall-clock limit, so this is allowed to take as long as it takes.
paths:
  raw: data/raw
  processed: data/processed
  runs: runs
seeds:
- 42
- 101
- 202
- 303
- 404
tracking:
  backend: none
  project: tnk1
targets:
  tnk1: Q13470
  tnk2: Q07912
  focus_kinases:
    SRC: P12931
    ABL1: P00519
    LCK: P06239
    PTK2: Q05397
    EGFR: P00533
    KDR: P35968
    FLT3: P36888
    JAK2: O60674
    YES1: P07947
offtarget_panel:
- Q07912
- P12931
- P00519
- P06239
- Q05397
- P00533
- P35968
- P36888
data:
