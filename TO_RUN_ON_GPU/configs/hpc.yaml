  bindingdb_tsv: data/raw/BindingDB_All.tsv
  pkis_csv: data/raw/pkis_long.csv
  kinomescan_csv: data/raw/kinomescan_long.csv
  dkk_csv: data/raw/dkk_tnk1_curated.csv
  kinase_table: data/raw/kinases.csv
  chembl_unlabelled_smiles: data/raw/chembl_drug_like.smi
  full_kinome: true
  desc_scaler_n: 200000
  standard_types:
  - IC50
  - Ki
  - Kd
  dose_response_types:
  - IC50
  - Ki
  - Kd
  - EC50
  - Potency
  - AC50
  - GI50
  pact_min: 2.0
  pact_max: 12.0
  drop_composite_targets: true
  max_kinome_rows: null
  mw_range:
  - 150
  - 900
  hac_range:
  - 10
  - 65
  allowed_elements:
  - C
  - N
  - O
  - S
  - F
  - Cl
  - Br
  - I
  - P
  - B
  - H
  replicate_range_max: 1.0
  replicate_policy: drop
  censor_tau: 5.0
splits:
  seed: 42
  tnk1_test_frac: 0.2
  n_outer: 5
  n_inner: 5
  tune_outer_folds: null
  tune_inner_folds: null
model:
  hidden: 300
  depth: 3
  dropout: 0.2
  n_desc: 200
  kin_proj_dim: 128
  esm_dim: 1280
  klifs_dim: 425
  fusion_hidden:
  - 512
  - 256
  design: B
ssl_pretrain:
  epochs: 20
  batch_size: 256
  lr: 0.001
  mask_frac: 0.15
  num_workers: 8
kinome_train:
  epochs: 5
  batch_size: 256
  lr: 0.001
  weight_decay: 1.0e-05
  lambda_sim: 3.0
  lambda_grid:
  - 0
  - 1
  - 3
  - 10
  cap_n: 2000
  sim_klifs: 0.7
  sim_esm: 0.3
  huber_delta: 1.0
  cens_weight: 0.5
finetune:
  phase1:
    epochs: 15
    lr_head: 0.0003
  phase2:
    epochs: 45
    lr_enc: 1.0e-05
    lr_head: 0.0001
    patience: 12
  alpha_enc: 0.01
  alpha_head: 0.001
  loss: nll
  inhouse_weight: 3.0
uq:
  n_members: 10
  independent_kinome_training: false
  mc_dropout_T: 50
  alpha: 0.1
  ad_k: 5
  ad_percentile: 95
  oof_members: 5
admet:
  n_members: 5
  epochs: 12
  endpoints:
    solubility:
      tdc:
      - ADME
      - Solubility_AqSolDB
      task: reg
    caco2:
      tdc:
      - ADME
      - Caco2_Wang
      task: reg
    microsome:
      tdc:
      - ADME
      - Clearance_Microsome_AZ
      task: reg
    cyp3a4:
      tdc:
      - ADME
      - CYP3A4_Veith
      task: cls
    cyp2d6:
      tdc:
      - ADME
      - CYP2D6_Veith
      task: cls
    herg:
      tdc:
      - Tox
      - hERG_Karim
      task: cls
    ames:
      tdc:
      - Tox
      - AMES
      task: cls
filters:
  sa_max: 4.2
  mw_max_hard: 600
  herg_max: 0.5
  ames_max: 0.4
  sa_max_hard: 5.5
  rot_max: 10
  qed_min: 0.2
tpp:
  herg_max: 0.2
  ames_max: 0.3
  sa_max: 4.5
  qed_min: 0.35
  rot_max: 7
  mw_max: 600.0
cycle01_repro:
  filters:
    sa_max: 4.2
    mw_max_hard: 600
    herg_max: 0.85
    ames_max: 0.5
rl:
  steps: 1000
  batch_size: 128
  sigma: 120
  lr: 0.0001
  strategy: dap
  beta_explore: 0.3
  beta_explore_steps: 300
  beta_final: 1.5
  gamma: 1.0
  pot_c: 7.0
  pot_k: 2.0
  sel_c: 1.2
  sel_k: 2.0
  ad_scale: 0.15
  weights:
    pot: 3.0
    sel: 2.0
    ad: 1.5
    sa: 1.0
    adme: 1.0
    safety: 1.5
    qed: 0.5
  use_v2: true
  weights_v2:
    pot: 3.0
    sel: 2.5
    hinge: 2.0
    ad: 1.0
    sa: 1.5
    safety: 2.5
  calibrate_at_runtime: true
  calibrate_target_frac: 0.3
  calibrate_n: 10000
  diversity:
    bucket_size: 25
    min_score: 0.55
  veto:
    safety: 0.1
    sa: 0.05
  # ---- Stage 7b: alternative policy-optimisation objectives (see configs/default.yaml
  # for the full commentary). `--algo dap` is the default and reads none of these.
  # rl_min/run_rl.py REFUSES a key the selected trainer does not read.
  augmem:     {am_rounds: 2, am_randomise: true, am_purge: true}
  drgrpo:     {pg_advantage: mean, pg_clip: 0.2, pg_epochs: 1, kl_coef: 0.02, kl_target: null}
  ahc:        {topk: 0.5, ahc_min_keep: 8, ahc_likelihood_penalty: 0.0}
  grpo:       {pg_advantage: grpo, pg_clip: 0.2, pg_epochs: 1, kl_coef: 0.02, kl_target: null}
  rloo:       {pg_advantage: rloo, kl_coef: 0.02, kl_target: null}
  ppo:        {pg_advantage: mean, pg_clip: 0.2, pg_epochs: 4, kl_coef: 0.02, kl_target: null}
  gflownet:   {gfn_beta: 1.0, gfn_r_floor: 1.0e-4, gfn_logz_lr: 0.1, gfn_prior_weight: 0.0}
rl_min:
  corpus: unique_molecules_788k.parquet
  corpus_col: canonical_smiles
  prior:
    epochs: 40
    batch: 512
    hidden: 512
    layers: 3
    dropout: 0.2
    min_validity: 0.8
  replay_size: 100
  replay_batch: 16
  grad_clip: 5.0
  temperature: 1.0
  baseline_n: 2000
al:
  pool_size: 200000
  pareto_keep: 1500
  audit_tol: 1.0
  retro_max_steps: 4
  retro_min_state_score: 0.85
  ei_xi: 0.05
  ucb_kappa: 1.5
  butina_dist: 0.4
  max_per_cluster: 2
  batch:
    exploit: 16
    explore: 12
    novel: 8
    control: 4
  exploit_lcb_k: 1.0
  exploit_min_sel: 1.5
  explore_min_mu: 6.3

# ---------------- Stage 2b / 4b: the model zoo and the stacked critic ----------------
# Commentary in configs/default.yaml. `repeats` is the one that matters here: the exact
# Wilcoxon floor at 5 folds is p >= 0.0625, so 10 repeats x 5 folds = 50 scores is what can reach p < 0.05.
zoo:
  tag: core
  repeats: 10
  inner_metric: rmse
  incumbent: rf
  scaler: robust

stack:
  metric: spearman
  min_coverage: 0.95

critic:
  backend: ensemble           # ensemble | zoo | zoo_stack
  zoo_model: rf
  zoo_models: [rf, gp_minmax, lgbm]
  zoo_stacker: nnls
  min_rows: 30
  kappa: 1.0
