# ---------------- Global ----------------
paths:
  raw: data/raw
  processed: data/processed
  runs: runs
seeds: [42, 101, 202, 303, 404]
tracking: {backend: none, project: tnk1}      # none | wandb | mlflow
targets:
  tnk1: Q13470
  tnk2: Q07912
  focus_kinases: {SRC: P12931, ABL1: P00519, LCK: P06239, PTK2: Q05397, EGFR: P00533, KDR: P35968, FLT3: P36888, JAK2: O60674, YES1: P07947}
offtarget_panel: [Q07912, P12931, P00519, P06239, Q05397, P00533, P35968, P36888]  # TNK2,SRC,ABL1,LCK,PTK2,EGFR,KDR,FLT3

# ---------------- Stage 1 ----------------
data:
  chembl_sqlite: data/raw/chembl_34.db
  bindingdb_tsv: data/raw/BindingDB_All.tsv
  pkis_csv: data/raw/pkis_long.csv              # columns: smiles,uniprot_id,value_nM,standard_type
  kinomescan_csv: data/raw/kinomescan_long.csv  # Davis/Fabian/Karaman, same columns
  dkk_csv: data/raw/dkk_tnk1_curated.csv        # manual TNK1 curation (TP-0903, dasatinib, bosutinib ...)
  kinase_table: data/raw/kinases.csv            # uniprot_id,gene_name,domain_sequence,klifs_pocket_85
  chembl_unlabelled_smiles: data/raw/chembl_drug_like.smi
  # Ingest kinome_all_measurements_3.95M.parquet instead of kinome_multitask_300k.parquet.
  # Only rows with a finite pActivity are usable by task_loss (~1.35M of ~4M); the
  # %-inhibition and qualitative-flag rows are dropped with a printed count. Stage 1
  # raises if the file is absent rather than silently falling back.
  full_kinome: true
  # Molecules the 200-d RobustScaler is fitted on. Was hardcoded at 50_000; 0 means "all
  # unique structures". 200k is ample for 200 quantiles and keeps Stage 1 fast.
  desc_scaler_n: 200000
  standard_types: [IC50, Ki, Kd]
  mw_range: [150, 900]
  hac_range: [10, 65]
  allowed_elements: [C, N, O, S, F, Cl, Br, I, P, B, H]
  replicate_range_max: 1.0
  replicate_policy: drop                        # drop | keep_median
  censor_tau: 5.0
splits:
  seed: 42
  tnk1_test_frac: 0.20
  n_outer: 5
  n_inner: 5
  # Folds used for Stage 2 hyperparameter SELECTION. The shipped code hardcoded [:2]/[:2],
  # i.e. 4 of the 25 folds, while the notebook reported "5x5 nested scaffold CV". null =
  # use every fold (26 configs x 25 folds = 650 fits, roughly 30-60 min). Set to 2/2 to
  # reproduce the old numbers, or to trade accuracy for wall-clock.
  tune_outer_folds: null
  tune_inner_folds: null

# ---------------- Stage 3 ----------------
model:
  hidden: 300
  depth: 3
  dropout: 0.2
  n_desc: 200
  kin_proj_dim: 128
  esm_dim: 1280
  klifs_dim: 425
  fusion_hidden: [512, 256]
  design: B                                     # A | B
ssl_pretrain:
  epochs: 20
  batch_size: 256
  lr: 1.0e-3
  mask_frac: 0.15
  num_workers: 8
kinome_train:
  epochs: 5
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-5
  lambda_sim: 3.0                               # tuned on LOKO over {0,1,3,10}
  lambda_grid: [0, 1, 3, 10]
  # NOT a data cap -- it is the per-kinase importance weight
  #     w_ik = (1 + lam*S_k^2) * min(1, sqrt(cap_n / N_k))
  # which downweights over-represented kinases. Removing it does NOT give you "more data";
  # it lets EGFR (19,085 pairs) and KDR (15,756) dominate the loss over TNK2 (1,350), the
  # closest homolog to TNK1 and the one that transfers best. With full_kinome=true the
  # imbalance grows, so this matters MORE, not less. Stage 3 `ablate` already measures the
  # cap_n=1e9 variant if you want the comparison.
  cap_n: 2000
  sim_klifs: 0.7
  sim_esm: 0.3
  huber_delta: 1.0
  cens_weight: 0.5
finetune:
  phase1: {epochs: 15, lr_head: 3.0e-4}
  phase2: {epochs: 45, lr_enc: 1.0e-5, lr_head: 1.0e-4, patience: 12}
  alpha_enc: 1.0e-2
  alpha_head: 1.0e-3
  loss: nll                                     # nll (ensemble members) | huber
  inhouse_weight: 3.0

# ---------------- Stage 4 ----------------
uq:
  n_members: 10
  independent_kinome_training: false            # see README: shared theta0 under-estimates epistemic variance -> false for practical deep ensemble fine-tuning
  mc_dropout_T: 50
  alpha: 0.10
  ad_k: 5
  ad_percentile: 95

# ---------------- Stage 5 ----------------
admet:
  n_members: 5
  endpoints:
    solubility: {tdc: ["ADME", "Solubility_AqSolDB"], task: reg}
    caco2: {tdc: ["ADME", "Caco2_Wang"], task: reg}
    microsome: {tdc: ["ADME", "Clearance_Microsome_AZ"], task: reg}
    cyp3a4: {tdc: ["ADME", "CYP3A4_Veith"], task: cls}
    cyp2d6: {tdc: ["ADME", "CYP2D6_Veith"], task: cls}
    herg: {tdc: ["Tox", "hERG_Karim"], task: cls}
    ames: {tdc: ["Tox", "AMES"], task: cls}
filters:
  sa_max: 4.2
  mw_max_hard: 600
  # Hard-gate p(hERG) ceiling. Was previously unset and resolved by a code-level
  # `.get("herg_max", 0.85)` default, so the gate admitted p(hERG) up to 0.85 while the
  # TPP table in tnk1/admet/admet.py asks for hERG < 0.20. Pinned here at the historical
  # 0.85 so locked Cycle-01 numbers still reproduce; see OPEN DECISION in
  # PIPELINE_AUDIT.md before tightening it towards the TPP for Cycle 02.
  herg_max: 0.85

# ---------------- Stage 6/7 ----------------
rl:
  steps: 1000
  batch_size: 128
  sigma: 120
  lr: 1.0e-4
  strategy: dap                                 # verify against your pinned REINVENT4 release (dap | mauli)
  beta_explore: 0.3
  beta_explore_steps: 300
  beta_final: 1.5
  gamma: 1.0
  # pot_c / sel_c are RECALIBRATED AT RUNTIME by the notebook from a fresh sample of the
  # prior (tnk1.rl.reward.calibrate_centre, target_frac=0.30). The literals below are the
  # historical Cycle-01 values, kept only so that run can be reproduced -- they are bad
  # defaults and should not be used for a new run.
  #
  # Measured over the 12,000-molecule Cycle-01 pool:
  #   pot_c = 7.0 while mu_tnk1 had mean 6.16  -> r_pot mean 0.185
  #   sel_c = 1.2 while mu_sel  had MAX  0.25  -> r_sel mean 0.0089, 70% below 0.01
  # No molecule in the pool ever reached the selectivity sigmoid's midpoint, so a
  # nominal weight of 2.0/10.5 bought a near-constant ~0.38x penalty carrying almost no
  # gradient. Recalibrating both centres moved the realised-signal spread across
  # components from 23.0x to 5.9x and max R from 0.399 to 0.773.
  pot_c: 7.0
  pot_k: 2.0
  sel_c: 1.2
  sel_k: 2.0
  ad_scale: 0.15
  # Intended influence vs. REALISED influence (sd(log r) x normalised weight), measured on
  # the Cycle-01 pool. They diverged badly:
  #   ad 0.380 > pot 0.335 > sel 0.157 > safety 0.080 > sa 0.037 > adme 0.019 > qed 0.016
  # A weight-1.5 regulariser (ad) was the largest single driver of the objective, because
  # d_lat reached 240831.9 against a threshold of 1.007 (fixed in tnk1/uq/applicability.py).
  # adme and qed sit at the noise floor: they cost weight and return no gradient, so they
  # belong in hard_gate. Audit any change with tnk1.rl.reward.component_signal and aim to
  # keep the surviving components within ~2x of each other.
  weights: {pot: 3.0, sel: 2.0, ad: 1.5, sa: 1.0, adme: 1.0, safety: 1.5, qed: 0.5}
  diversity: {bucket_size: 25, min_score: 0.55}
  veto: null                                    # e.g. {safety: 0.05, sa: 0.05}; manual's formula alone does NOT give near-zero reward on a failed component

# ---------------- Stage 7 alternative backend: rl_min ----------------
# In-process DAP trainer (rl_min/). Unlike the REINVENT path it needs no second conda env
# and no REST server, and it TRAINS the generator rather than sampling a fixed pool.
# `sigma` multiplies the reward, so the reward's attainable range is part of this
# hyperparameter: calibrate R to span [0,1] before sweeping sigma or the two are confounded.
rl_min:
  corpus: unique_molecules_788k.parquet   # 787,283 structures; null = Stage 6 kinase corpus
  corpus_col: canonical_smiles
  prior:
    epochs: 40
    batch: 512
    hidden: 512
    layers: 3
    dropout: 0.2
    min_validity: 0.80        # gate: DAP cannot rescue a prior that emits garbage
  replay_size: 100            # sparse rewards -> without replay the gradient sees only failures
  replay_batch: 16
  grad_clip: 5.0
  temperature: 1.0
  baseline_n: 2000            # prior samples scored before training, for the comparison
                              # that distinguishes "policy improved" from "drew more samples"

# ---------------- Stage 8 ----------------
al:
  # Candidates drawn from the trained agent and carried into Stage 8. Scoring cost is
  # linear in this; 200k takes roughly 4x as long as the old 50k.
  pool_size: 200000
  pareto_keep: 1500
  audit_tol: 1.0
  retro_max_steps: 4
  retro_min_state_score: 0.85
  ei_xi: 0.05
  ucb_kappa: 1.5
  butina_dist: 0.40
  max_per_cluster: 2
  batch: {exploit: 16, explore: 12, novel: 8, control: 4}
  exploit_lcb_k: 1.0
  exploit_min_sel: 1.5
  explore_min_mu: 6.3
