# ---------------- Global ----------------
paths:
  raw: data/raw
  processed: data/processed
  runs: runs
seeds: [42, 101, 202, 303, 404]
tracking: {backend: none, project: tnk1}      # none | wandb | mlflow
targets:
  tnk1: Q13470
  tnk2: Q07912
  focus_kinases: {SRC: P12931, ABL1: P00519, LCK: P06239, PTK2: Q05397, EGFR: P00533, KDR: P35968, FLT3: P36888, JAK2: O60674, YES1: P07947}
offtarget_panel: [Q07912, P12931, P00519, P06239, Q05397, P00533, P35968, P36888]  # TNK2,SRC,ABL1,LCK,PTK2,EGFR,KDR,FLT3

# ---------------- Stage 1 ----------------
data:
  chembl_sqlite: data/raw/chembl_34.db
  bindingdb_tsv: data/raw/BindingDB_All.tsv
  pkis_csv: data/raw/pkis_long.csv              # columns: smiles,uniprot_id,value_nM,standard_type
  kinomescan_csv: data/raw/kinomescan_long.csv  # Davis/Fabian/Karaman, same columns
  dkk_csv: data/raw/dkk_tnk1_curated.csv        # manual TNK1 curation (TP-0903, dasatinib, bosutinib ...)

  # ---- Harvested measurements (scripts/tnk1_harvest.py) ---------------------------
  # The harvester's merged master table. ABSENT -> silently skipped, so the pipeline
  # behaves exactly as before until a harvest exists; present -> its rows join the ingest
  # alongside ChEMBL/BindingDB/PKIS. Read by `tnk1.data.extract.from_harvest_csv`, which
  # maps the harvester's column names onto Stage 1's and PRESERVES per-row `source`
  # (`from_long_csv` would overwrite it with one literal string).
  harvest_master_csv: data/raw/TNK1_kinase_master.csv
  # Admit right-censored (`>`, `>=`) rows. The harvester's own is_training_ready_exact
  # flag demands relation == "=", which discards them; the pipeline models them (each row
  # keeps its own bound and the loss has a censored term), so they are kept by default.
  harvest_allow_censored: true
  # Keep only rows whose target is in the harvester's kinase panel.
  harvest_require_panel: true
  # Semantics whose number is not a single direct measurement of the quantity its
  # activity_type names, and so must not be pooled with one by aggregate_replicates.
  # See tnk1.data.extract.HARVEST_EXCLUDE_SEMANTICS for what each one is.
  harvest_exclude_semantics: [kiba_score, gtopdb_curated_summary, activity_outcome_only]
  # true appends the semantics tag to standard_type (e.g. `Kd@kd_nM_matrix_Davis2011`) so
  # competition-binding Kd_app forms its own replicate group instead of pooling with
  # solution Kd. It alters a grouping key, so tables built with and without are NOT
  # comparable -- changing it is a new dataset version, not a tweak.
  harvest_distinguish_semantics: false

  kinase_table: data/raw/kinases.csv            # uniprot_id,gene_name,domain_sequence,klifs_pocket_85
  chembl_unlabelled_smiles: data/raw/chembl_drug_like.smi
  # Ingest kinome_all_measurements_3.95M.parquet instead of kinome_multitask_300k.parquet.
  # Only rows with a finite pActivity are usable by task_loss (~1.35M of ~4M); the
  # %-inhibition and qualitative-flag rows are dropped with a printed count. Stage 1
  # raises if the file is absent rather than silently falling back.
  full_kinome: true
  # Molecules the 200-d RobustScaler is fitted on. Was hardcoded at 50_000; 0 means "all
  # unique structures". 200k is ample for 200 quantiles and keeps Stage 1 fast.
  desc_scaler_n: 200000
  standard_types: [IC50, Ki, Kd]

  # ---- Measurability filter (tnk1.data.activity.filter_measurable) ----------------
  # Which rows of the kinome store the REGRESSION head may consume, and what counts as a
  # physically possible value. These are not cosmetic: before this filter existed, Stage 1
  # used `np.isfinite(pActivity)` and the store encodes "no dose-response value" as
  # pActivity == 0.0, NOT NaN. isfinite(0.0) is True, so of the 4,798,165 rows in
  # kinome_all_measurements_3.95M.parquet:
  #
  #   3,374,532 (70.3%)  carried pActivity exactly 0.0 with is_censored=0 -- presented to
  #                      task_loss as an EXACT measurement of IC50 = 1 molar. Every one of
  #                      the 3,338,837 non-dose-response rows (OUTCOME 1.80M,
  #                      PCT_INHIBITION 771k, kon 258k, koff 258k, Residual Activity 70k,
  #                      Activity 60k, PCT_CONTROL 58k, PCT_ACTIVITY 29k) is in this group.
  #     108,450          had 0 != pActivity < 2.0, i.e. value_nM from 1.0e7 to 1.3e20
  #                      (median 3.2e14 nM = 316,000 M). 107,795 are PubChem `Ki` rows
  #                      whose value was not in nM. They read as very weak binders.
  #
  # kinome_long_v2.parquet was built before this filter and contains 3,372,521 poisoned
  # rows out of 4,796,129 -- do not train on it. With the filter, 1,315,069 rows survive,
  # which is the ~1.35M that CHANGES_V2.md documents as usable.
  #
  # Readouts whose value IS a concentration, so pAct = 9 - log10(value_nM) is meaningful.
  # Anything else (qualitative flags, single-point percentages, rate constants) needs a
  # classification head, not task_loss.
  dose_response_types: [IC50, Ki, Kd, EC50, Potency, AC50, GI50]
  # pAct 2 == 10 mM (weaker than any reported kinase inhibitor);
  # pAct 12 == 1 pM (tighter than the tightest known small-molecule kinase binder).
  pact_min: 2.0
  pact_max: 12.0
  # 642 of the store's `uniprot_accession` values are semicolon-joined lists of up to ~150
  # accessions (panel aggregates / protein complexes), covering 211,546 filtered rows.
  # A value measured against a target SET cannot be attributed to one kinase, and
  # duplicating the row across its members would fabricate measurements. They were already
  # being discarded silently by `kinome_stage`'s `isin(kinase_store ids)`; dropping them
  # here makes it a counted decision. true also fixes the row-count report, which claimed
  # 1054 distinct kinases when only 491 are real single accessions.
  drop_composite_targets: true

  # ---- Development knob: cap the kinome rows for a fast end-to-end smoke run ---------
  # null in production. Set it (e.g. 20000) and `Ctx` deterministically samples the
  # off-target rows down to that many, ALWAYS keeping every TNK1 row (they carry the
  # labels every metric is computed on, and the frozen splits are keyed by TNK1 compound).
  # Needed because `LabelledSet.__init__` computes descriptors for every row up front, so
  # even a 1-epoch / 2-member run over the full table costs tens of minutes before the
  # first gradient step -- which made verifying a code change too slow to do routinely.
  # A run with this set prints a loud warning and must never be reported as a result.
  max_kinome_rows: null

  mw_range: [150, 900]
  hac_range: [10, 65]
  allowed_elements: [C, N, O, S, F, Cl, Br, I, P, B, H]
  replicate_range_max: 1.0
  replicate_policy: drop                        # drop | keep_median
  censor_tau: 5.0
splits:
  seed: 42
  tnk1_test_frac: 0.20
  n_outer: 5
  n_inner: 5
  # Folds used for Stage 2 hyperparameter SELECTION. The shipped code hardcoded [:2]/[:2],
  # i.e. 4 of the 25 folds, while the notebook reported "5x5 nested scaffold CV". null =
  # use every fold (26 configs x 25 folds = 650 fits, roughly 30-60 min). Set to 2/2 to
  # reproduce the old numbers, or to trade accuracy for wall-clock.
  tune_outer_folds: null
  tune_inner_folds: null

# ---------------- Stage 3 ----------------
model:
  hidden: 300
  depth: 3
  dropout: 0.2
  n_desc: 200
  kin_proj_dim: 128
  esm_dim: 1280
  klifs_dim: 425
  fusion_hidden: [512, 256]
  design: B                                     # A | B
ssl_pretrain:
  epochs: 20
  batch_size: 256
  lr: 1.0e-3
  mask_frac: 0.15
  num_workers: 8
kinome_train:
  epochs: 5
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-5
  lambda_sim: 3.0                               # tuned on LOKO over {0,1,3,10}
  lambda_grid: [0, 1, 3, 10]
  # NOT a data cap -- it is the per-kinase importance weight
  #     w_ik = (1 + lam*S_k^2) * min(1, sqrt(cap_n / N_k))
  # which downweights over-represented kinases. Removing it does NOT give you "more data";
  # it lets EGFR (19,085 pairs) and KDR (15,756) dominate the loss over TNK2 (1,350), the
  # closest homolog to TNK1 and the one that transfers best. With full_kinome=true the
  # imbalance grows, so this matters MORE, not less. Stage 3 `ablate` already measures the
  # cap_n=1e9 variant if you want the comparison.
  cap_n: 2000
  sim_klifs: 0.7
  sim_esm: 0.3
  huber_delta: 1.0
  cens_weight: 0.5
finetune:
  phase1: {epochs: 15, lr_head: 3.0e-4}
  phase2: {epochs: 45, lr_enc: 1.0e-5, lr_head: 1.0e-4, patience: 12}
  alpha_enc: 1.0e-2
  alpha_head: 1.0e-3
  loss: nll                                     # nll (ensemble members) | huber
  inhouse_weight: 3.0

# ---------------- Stage 4 ----------------
uq:
  n_members: 10
  independent_kinome_training: false            # see README: shared theta0 under-estimates epistemic variance -> false for practical deep ensemble fine-tuning
  mc_dropout_T: 50
  alpha: 0.10
  ad_k: 5
  ad_percentile: 95

# ---------------- Stage 5 ----------------
admet:
  n_members: 5
  # Was pinned at tnk1.admet.admet.train_endpoint's default of 12 with no config path, so
  # the only way to change it was to edit the function. All 7 endpoints share it.
  epochs: 12
  endpoints:
    solubility: {tdc: ["ADME", "Solubility_AqSolDB"], task: reg}
    caco2: {tdc: ["ADME", "Caco2_Wang"], task: reg}
    microsome: {tdc: ["ADME", "Clearance_Microsome_AZ"], task: reg}
    cyp3a4: {tdc: ["ADME", "CYP3A4_Veith"], task: cls}
    cyp2d6: {tdc: ["ADME", "CYP2D6_Veith"], task: cls}
    herg: {tdc: ["Tox", "hERG_Karim"], task: cls}
    ames: {tdc: ["Tox", "AMES"], task: cls}
filters:
  sa_max: 4.2                 # display/reporting threshold (NOT the hard gate; see sa_max_hard)
  mw_max_hard: 600

  # ---- TIER A: the absurdity gate (tnk1.rl.reward.hard_gate) ----------------------
  # These are deliberately LOOSER than the TPP. A hard gate deletes molecules, it does not
  # shape them: everything it rejects scores R = 0 and contributes no more gradient than a
  # molecule that is merely bad. Measured on the Cycle-01 contract (the best 40 of 12,000),
  # applying the TPP thresholds jointly as a hard gate passes only 5 of 40; on raw
  # generator output joint survival is well under 1%, which would leave a 128-molecule DAP
  # batch with ~1 non-zero reward and no learnable signal.
  #
  # So Tier A cuts only the indefensible tail, Tier B (rl.weights, r_safety_tpp, r_sa)
  # carries the gradient toward the TPP, and Tier C (`tpp` below) enforces the TPP strictly
  # at final selection, where the pool is already optimised.
  herg_max: 0.50              # was 0.85 -- admitted near-certain cardiotoxicity
  ames_max: 0.40              # was hardcoded 0.50 in reward.hard_gate
  sa_max_hard: 5.5            # matches r_sa's upper rail; anything above is unmakeable
  rot_max: 10                 # entropy absurdity cut, not the TPP's 7
  qed_min: 0.20               # was absent; 0.20 removes non-drug-like matter only

# ---- TIER C: target product profile, enforced at final selection ------------------
# Applied by tnk1.rl.reward.tpp_select at Stage 8 contract assembly, NOT during RL.
# On the Cycle-01 contract these reject 35 of 40 shipped compounds, which is the correct
# verdict: 29 of them exceed the hERG ceiling and 15 exceed SA 4.5. Cycle 02 must select
# against this, having first used Tier B to move the population toward it.
tpp:
  herg_max: 0.20
  ames_max: 0.30
  sa_max: 4.5
  qed_min: 0.35
  rot_max: 7
  mw_max: 600.0

# ---- Cycle-01 reproduction -------------------------------------------------------
# The locked Cycle-01 numbers were produced with the pre-fix gate. To reproduce them,
# override `filters` with these values and pass components=COMPONENTS (not COMPONENTS_V2).
cycle01_repro:
  filters: {sa_max: 4.2, mw_max_hard: 600, herg_max: 0.85, ames_max: 0.50}

# ---------------- Stage 6/7 ----------------
rl:
  steps: 1000
  batch_size: 128
  sigma: 120
  lr: 1.0e-4
  strategy: dap                                 # verify against your pinned REINVENT4 release (dap | mauli)
  beta_explore: 0.3
  beta_explore_steps: 300
  beta_final: 1.5
  gamma: 1.0
  # pot_c / sel_c are RECALIBRATED AT RUNTIME by the notebook from a fresh sample of the
  # prior (tnk1.rl.reward.calibrate_centre, target_frac=0.30). The literals below are the
  # historical Cycle-01 values, kept only so that run can be reproduced -- they are bad
  # defaults and should not be used for a new run.
  #
  # Measured over the 12,000-molecule Cycle-01 pool:
  #   pot_c = 7.0 while mu_tnk1 had mean 6.16  -> r_pot mean 0.185
  #   sel_c = 1.2 while mu_sel  had MAX  0.25  -> r_sel mean 0.0089, 70% below 0.01
  # No molecule in the pool ever reached the selectivity sigmoid's midpoint, so a
  # nominal weight of 2.0/10.5 bought a near-constant ~0.38x penalty carrying almost no
  # gradient. Recalibrating both centres moved the realised-signal spread across
  # components from 23.0x to 5.9x and max R from 0.399 to 0.773.
  pot_c: 7.0
  pot_k: 2.0
  sel_c: 1.2
  sel_k: 2.0
  ad_scale: 0.15
  # Intended influence vs. REALISED influence (sd(log r) x normalised weight), measured on
  # the Cycle-01 pool. They diverged badly:
  #   ad 0.380 > pot 0.335 > sel 0.157 > safety 0.080 > sa 0.037 > adme 0.019 > qed 0.016
  # A weight-1.5 regulariser (ad) was the largest single driver of the objective, because
  # d_lat reached 240831.9 against a threshold of 1.007 (fixed in tnk1/uq/applicability.py).
  # adme and qed sit at the noise floor: they cost weight and return no gradient, so they
  # belong in hard_gate. Audit any change with tnk1.rl.reward.component_signal and aim to
  # keep the surviving components within ~2x of each other.
  weights: {pot: 3.0, sel: 2.0, ad: 1.5, sa: 1.0, adme: 1.0, safety: 1.5, qed: 0.5}

  # Cycle-02 component set and weights (tnk1.rl.reward.COMPONENTS_V2). `weights` above is
  # the Cycle-01 set, kept so that run reproduces. Set rl.use_v2 to switch.
  #
  # adme (realised signal 0.019) and qed (0.016) are GONE, not reweighted: they sat at the
  # noise floor, so they bought nothing with their 1.5 of the weight budget. Both are now
  # enforced in hard_gate / tpp_select, where a flat criterion is free.
  # hinge is NEW and soft (r_hinge floors at 0.1 rather than gating): only 27.5% of the
  # Cycle-01 pool matched any hinge SMARTS, so a hard gate would delete three quarters of
  # every batch and also forbid the generator from finding an unlisted hinge motif.
  # ad SURVIVES at a reduced 1.0. It dominated Cycle 01 (0.380) only because d_lat had
  # blown up to 240,832 against a 1.007 threshold; that is fixed. It is the only term
  # stopping the policy optimising a critic whose test Spearman is 0.264 off-distribution.
  use_v2: true
  weights_v2: {pot: 3.0, sel: 2.5, hinge: 2.0, ad: 1.0, sa: 1.5, safety: 2.5}

  # pot_c/sel_c MUST be recalibrated at runtime (see the note above). With COMPONENTS_V2
  # the scorer does this itself when rl.calibrate_at_runtime is true, so the script path
  # no longer depends on the notebook having done it.
  calibrate_at_runtime: true
  calibrate_target_frac: 0.30
  calibrate_n: 10000

  diversity: {bucket_size: 25, min_score: 0.55}

  # ENABLED for Cycle 02. With normalised exponents a collapsed component only scales R by
  # (1e-4)^(w/sum w) -- about 0.27x for safety -- so without a veto a molecule can fail
  # safety outright and still outrank a clean one on potency. The thresholds are absurdity
  # cuts against the SHAPED terms: r_safety_tpp < 0.10 is roughly p(hERG) > 0.40 once the
  # other endpoints are reasonable, and r_sa < 0.05 is SA > 5.3.
  veto: {safety: 0.10, sa: 0.05}

  # ---- Stage 7b: alternative policy-optimisation objectives -------------------------
  #
  # One sub-block per algorithm, read ONLY by that algorithm's trainer, and read from
  # `rl.<algo>`. `rl_min/run_rl.py` REFUSES a key the selected trainer does not read
  # rather than ignoring it: silently unread config keys are this repository's most
  # recurrent defect class (eight of them in CHANGES_V3.md section 7, `rl.steps` as an
  # inert argparse literal, and the adme/qed components computed and discarded). The
  # accepted keys are declared in rl_min/algos/__init__.py::EXTRA_CONFIG_KEYS.
  #
  # `--algo dap` is the default and reads none of these, so an existing command line
  # reproduces the v3 run of record bit-for-bit.

  augmem:                     # Augmented Memory (Guo & Schwaller)
    am_rounds: 2              # A: augmentation rounds per step. Each replays the WHOLE
                              # buffer with the SMILES re-randomised, so each oracle call
                              # yields several gradient signals. This is where the sample
                              # efficiency comes from: PMO summed AUC Top-10 15.002 against
                              # REINVENT's 14.016, winning 19 of 23 tasks.
    am_randomise: true        # re-randomise SMILES each round (Bjerrum 2017). Half the
                              # mechanism: without it the agent memorises one spelling.
                              # A no-op without RDKit, and the trainer warns if so.
    am_purge: true            # Selective Memory Purge: drop buffer entries whose scaffold
                              # the diversity filter has saturated. NOT optional with
                              # whole-buffer replay -- it is what stops A rounds per step
                              # amplifying whichever scaffold arrived first.

  drgrpo:                     # Dr. GRPO (Liu et al. 2025, arXiv:2503.20783)
    pg_advantage: mean        # A_i = R_i - mean(R). NO division by the group std, which is
                              # the whole point: a reward component pinned at its floor has
                              # near-zero within-batch spread, so GRPO's /std inflates
                              # floating-point noise into large advantages. r_sel sat at
                              # 0.091-0.144 for all 1000 steps of the v3 run, which is
                              # exactly that regime. Prefer this over `grpo` here.
    pg_clip: 0.2
    pg_epochs: 1
    kl_coef: 0.02
    kl_target: null

  ahc:                        # Augmented Hill-Climb (Thomas et al., J Cheminform 2022)
    topk: 0.5                 # fraction of each batch the loss is computed on. The
                              # paper's sample-efficiency claim rests on this: DAP
                              # regresses the agent onto the augmented likelihood for
                              # EVERY sample, and for a zero-scoring molecule that target
                              # is just the prior -- so the update spends gradient pulling
                              # the agent back toward chemistry it already knows.
    ahc_min_keep: 8           # never update on fewer than this, whatever topk works out to
    ahc_likelihood_penalty: 0.0
                              # the reference implementation adds -mean(1/agent_nll) at
                              # weight 5e3, which discourages driving any one sequence's
                              # likelihood arbitrarily high -- hill-climbing's usual mode
                              # collapse. 0.0 here so `ahc` differs from `dap` in ONE
                              # variable; set 5000 to reproduce the published setup.
                              # ALSO: the reference drops sigma from 128 to 60 for AHC,
                              # because discarding the bottom half of the batch already
                              # concentrates the update. Halve rl.sigma when using --algo ahc
                              # or the effective step size is doubled.

  grpo:                       # Group-relative policy optimisation (Shao et al. 2024)
    pg_advantage: grpo        # the batch IS the group: no prompt, one shared comparison set
    pg_clip: 0.2
    pg_epochs: 1              # on-policy; raise only with pg_clip in place
    kl_coef: 0.02             # anchor to the 788k-molecule prior. NOT optional: policy
                              # gradient without it degrades validity within tens of steps
    kl_target: null           # set a float to adapt kl_coef toward it (dual descent)

  rloo:                       # REINFORCE leave-one-out (Ahmadian et al., ACL 2024)
    pg_advantage: rloo        # unbiased baseline, no critic, no clipping
    kl_coef: 0.02
    kl_target: null

  ppo:                        # Clipped surrogate with batch reuse (Schulman et al. 2017)
    pg_advantage: mean
    pg_clip: 0.2
    pg_epochs: 4              # the reuse PPO exists for; watch clip_frac in history.csv
    kl_coef: 0.02
    kl_target: null

  gflownet:                   # Trajectory balance (Malkin et al. 2022)
    gfn_beta: 1.0             # reward exponent: P(x) proportional to R(x)^beta, so beta=1
                              # samples IN PROPORTION to reward instead of seeking the
                              # mode -- the structurally different answer to the diversity
                              # and selectivity collapse. Sweep it; this is the diversity
                              # knob, and far more interpretable than DAP's sigma, which is
                              # confounded with the reward's attainable range.
    gfn_r_floor: 1.0e-4       # log R needs R > 0. n_floored is logged per step, so a run
                              # where most of the batch sat on the floor is visible.
    gfn_logz_lr: 0.1          # log Z needs a much larger learning rate than the policy
    gfn_prior_weight: 0.0     # 0 = pure TB; raise to keep the prior's syntax as an anchor

# ---------------- Stage 7 alternative backend: rl_min ----------------
# In-process DAP trainer (rl_min/). Unlike the REINVENT path it needs no second conda env
# and no REST server, and it TRAINS the generator rather than sampling a fixed pool.
# `sigma` multiplies the reward, so the reward's attainable range is part of this
# hyperparameter: calibrate R to span [0,1] before sweeping sigma or the two are confounded.
rl_min:
  corpus: unique_molecules_788k.parquet   # 787,283 structures; null = Stage 6 kinase corpus
  corpus_col: canonical_smiles
  prior:
    epochs: 40
    batch: 512
    hidden: 512
    layers: 3
    dropout: 0.2
    min_validity: 0.80        # gate: DAP cannot rescue a prior that emits garbage
  replay_size: 100            # sparse rewards -> without replay the gradient sees only failures
  replay_batch: 16
  grad_clip: 5.0
  temperature: 1.0
  baseline_n: 2000            # prior samples scored before training, for the comparison
                              # that distinguishes "policy improved" from "drew more samples"

# ---------------- Stage 2b / 4b: the model zoo and the stacked critic ----------------
zoo:
  tag: core                   # which shortlist to benchmark (core|probe|slow|control)
  repeats: 10                 # repeated CV. The exact Wilcoxon floor at 5 folds is
                              # p >= 0.0625, so 5 fold scores can NEVER reach p < 0.05;
                              # 10 repeats x 5 folds = 50 scores can.
  inner_metric: rmse          # what the inner folds select hyperparameters on
  incumbent: rf               # every challenger is tested against this ONE model under
                              # Holm correction: 19 comparisons, not 190. The best of 20
                              # models beats its own honest estimate by roughly the spread
                              # of the 20 (Cawley & Talbot, JMLR 11:2079, 2010).
  scaler: robust              # robust | cdf (Chemprop-style empirical-CDF normalisation)

stack:
  metric: spearman            # the CV risk the discrete super learner minimises --
                              # Spearman, because that is what the RL reward's ordering
                              # consumes.
  min_coverage: 0.95          # drop a model that predicted fewer than this fraction of rows
  # The discrete super learner evaluates every combiner AND every individual model as
  # candidates (Phillips, van der Laan, Lee & Gruber, Int J Epidemiol 2023, step 5), so the
  # selected predictor can never be worse than the best single model. This project shipped
  # a combination -- the 10-member deep ensemble -- that was worse than a plain random
  # forest (Spearman 0.501 vs 0.686) and optimised a generator against it for 6 GPU-hours.

critic:
  backend: ensemble           # ensemble | zoo | zoo_stack
                              # `zoo`/`zoo_stack` route r_pot and r_sel through
                              # tnk1.zoo.critic instead of the deep ensemble. The scorer
                              # reaches the critic through only predict_members() and
                              # latent(), so this is an adapter, not a rewrite.
  zoo_model: rf               # backend=zoo: which registered model
  zoo_models: [rf, gp_minmax, lgbm]   # backend=zoo_stack: the member library
  zoo_stacker: nnls
  min_rows: 30                # a panel kinase with fewer exact rows is ABSENT from
                              # predictions rather than modelled from nothing: a fabricated
                              # off-target prediction flows straight into r_sel
  kappa: 1.0                  # pessimistic reward: optimise mu - kappa*sigma_epi. A
                              # stacked critic's sigma_epi IS the cross-architecture
                              # disagreement the v3 audit gate caught at 1.8 log units
                              # AFTER the fact; this charges for it during training
                              # (MOPO, Yu et al. 2020; MOReL, Kidambi et al. 2020).

# ---------------- Stage 8 ----------------
al:
  # Candidates drawn from the trained agent and carried into Stage 8. Scoring cost is
  # linear in this; 200k takes roughly 4x as long as the old 50k.
  pool_size: 200000
  pareto_keep: 1500
  audit_tol: 1.0
  retro_max_steps: 4
  retro_min_state_score: 0.85
  ei_xi: 0.05
